<html>
  <head>
    <style>
      h2 {
        text-align: center;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        padding: 10px;
        border: 1px solid #ccc;
        text-align: left;
      }

      th {
        background: #f3f4f6;
      }

      .wrapper {
        width: 760px;
        border: 8px solid #eee;
        padding: 24px;
        margin: auto;
        font-family: Arial, sans-serif;
      }

      .note {
        text-align: center;
        color: gray;
        margin-top: 32px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <h2>{{heading}}</h2>

      <p>Dear Team,</p>

      <p>{{message}}</p>

      <table>
        <tr>
          <td><b>Purpose</b></td>
          <td>{{purpose}}</td>
        </tr>
        <tr>
          <td><b>Initiator</b></td>
          <td>{{initiatorName}}</td>
        </tr>
        <tr>
          <td><b>Approver</b></td>
          <td>{{approverName}}</td>
        </tr>
        <tr>
          <td><b>Visit Date</b></td>
          <td>{{visitDate}}</td>
        </tr>
        <tr>
          <td><b>Status</b></td>
          <td>{{status}}</td>
        </tr>
      </table>

      <br />

      <table>
        <thead>
          <tr>
            <th>Gate Pass ID</th>
            <th>Visitor Name</th>
            <th>Mobile</th>
            <th>Company</th>
          </tr>
        </thead>
        <tbody>
          {{visitorRows}}
        </tbody>
      </table>

      <p class="note">
        <small>This is a system generated email. Please do not reply.</small>
      </p>
    </div>
  </body>
</html>
